<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Расписание стримов — Рисовый интерактив</title><meta name="theme-color" content="#15171c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍚</text></svg>">
<style>
:root{--bg:#15171c;--card:#22252d;--card2:#282c35;--line:#343844;--text:#ECEAE6;--muted:#8C919A;--gold:#FFC857;--hot:#ff4d3d}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Segoe UI",Roboto,Verdana,system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px 60px}
.banner{display:block;width:100%;height:auto;border-radius:10px;margin:22px 0 10px}
.hero .banner{margin-top:6px}
.how{background:var(--card);border-radius:10px;padding:14px 18px;margin:10px 0}
.how h2{margin:0 0 6px;color:var(--gold);font-size:18px}.how ol{margin:0;padding-left:22px}.how li{margin:4px 0}
.tiers{display:grid;gap:6px;margin:10px 0}.tiers div{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.tiers b{flex:none;min-width:118px;padding:3px 10px;border-radius:6px;color:#fff;background:var(--c)}
.bar{position:sticky;top:0;z-index:5;background:rgba(21,23,28,.96);backdrop-filter:blur(6px);padding:10px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#q{flex:1 1 240px;min-width:0;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px}
.links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 4px}
.lnk{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700;text-decoration:none}
.lnk:hover{border-color:#e9b949}.lnk.don{background:#e9b949;color:#15171c;border-color:#e9b949}
.page h1{text-align:center}.page h2{margin-top:26px}.page li{margin:6px 0;line-height:1.5}
.sched{width:100%;border-collapse:collapse}.sched td{padding:10px;border-bottom:1px solid var(--line)}
.chip{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font:inherit;font-weight:600}
.chip.on{background:var(--gold);color:#1b1d22;border-color:var(--gold)}
.nav{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:thin}
.nav a{flex:none;color:var(--muted);text-decoration:none;font-size:13px;padding:4px 10px;border-radius:20px;background:var(--card)}
.nav a:hover{color:var(--text)}.nav small{opacity:.6}.nav .hotnav{color:#1b1d22;background:var(--gold);font-weight:700}
#answer{margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--card2);display:none}
#answer a{color:var(--gold)}
.group{font-size:15px;margin:16px 0 6px;padding:6px 12px;background:#3A4050;border-radius:6px}
.stitle{color:var(--gold);text-align:center;font-size:28px;margin:26px 0 8px}
.ev{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:10px;padding:10px 12px;margin:6px 0}
.ev:nth-of-type(even){background:var(--card2)}
.ev.hit{outline:2px solid var(--gold)}
.tier{align-self:stretch;display:flex;align-items:center;justify-content:center;border-radius:7px;background:var(--c);color:#fff;font-weight:700;font-size:13px;text-align:center}
.ev h3{margin:0 0 2px;font-size:16px}.ev p{margin:0;font-size:14px;color:#d6d3cd}
.param{font-size:13px;color:var(--gold);margin-top:3px}.old{font-size:12px;color:var(--muted);font-style:italic;margin-top:3px}
.tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;vertical-align:2px;margin-left:4px;white-space:nowrap}
.tag.new{background:#2b5a8c}.tag.beta{background:#5b3d8c}.tag.sale{background:var(--hot)}
.prices{display:flex;flex-direction:column;gap:5px;align-items:stretch;min-width:120px}
.price{cursor:pointer;border:1px solid #4a4432;background:#2c2a22;color:var(--gold);border-radius:8px;padding:6px 10px;font:inherit;font-size:16px;text-align:center;white-space:nowrap}
.price:hover{background:#3a3626}.price .vl{display:block;font-size:11px;color:var(--muted);font-weight:400;white-space:normal}
.price.hot{background:var(--hot);border-color:var(--hot);color:#fff}.price.hot .vl{color:#ffe0dc}
.price.big{font-size:22px}
.salesec .note{text-align:center;color:var(--gold);font-weight:600;margin:0 0 8px}
.pct{align-self:stretch;display:flex;align-items:center;justify-content:center;border-radius:7px;background:var(--hot);color:#fff;font-weight:800;font-size:17px}
.saleev .prices s{color:var(--muted);text-align:center;font-size:15px}
.hidden{display:none!important}
#empty{display:none;text-align:center;color:var(--muted);padding:30px}
footer{margin-top:30px;text-align:center;color:var(--muted);font-size:13px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);background:var(--gold);color:#1b1d22;font-weight:700;padding:10px 16px;border-radius:10px;transition:transform .2s;z-index:9;max-width:calc(100% - 32px);text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
@media (max-width:640px){
 .ev{grid-template-columns:44px 1fr;gap:8px 10px}
 .prices{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;min-width:0}.price{flex:1 1 auto}
 .tier{font-size:12px}.tiers b{min-width:100px}
}
</style></head>
